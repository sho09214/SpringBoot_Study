<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.new.nz/web/thymeleaf/layout" layout:decorate="layout/layout">
<head>
  <meta charset="UTF-8">
  <title layout:fragment="title">Post List</title>
</head>
<body>
  <main layout:fragment="content">
    <h1>Post List</h1>
    <h2>新規投稿</h2>
    <a href="/posts/new" class="btn btn-primary mb-3">New Post</a>

    <!--検索フォーム-->
    <form th:action="@{/posts}" method="get" class="mb-3">
      <div class="row">
        <!--検索キーワード-->
        <div class="col-md-4">
          <input type="text" name="keyword" class="form-control" placeholder="Search" th:value="${param.keyword}" required>
        </div>

        <!--マッチタイプ-->
        <div class="col-md-2">
          <select name="matchType" class="form-control">
            <option value="contains" th:selected="${param.matchType?.toString() == 'contains'}">部分一致</option>
            <option value="startswith" th:selected="${param.matchType?.toString() == 'startWith'}">前方一致</option>
            <option value="endswith" th:selected="${param.matchType?.toString() == 'endWith'}">後方一致</option>
          </select>
        </div>

        <!--ソート基準-->
        <div class="col-md-2">
          <select name="sortBy" class="form-control">
            <option value="createdAt" th:selected="${param.sortBy?.toString() == 'createdAt'}">作成日</option>
            <option value="title" th:selected="${param.sortBy?.toString()} == 'title'">タイトル</option>
          </select>
        </div>

        <!--並び順-->
        <div class="col-md-2">
          <select name="sortOrder" class="form-control">
            <option value="asc" th:selected="${param.sortOrder?.toString() == 'asc'}">昇順</option>
            <option value="desc" th:selected="${param.sortOrder?.toString()} == 'desc'">降順</option>
          </select>
        </div>

        <!--検索ボタン-->
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary">検索</button>
        </div>
      </div>
    </form>

    <h2>掲示板一覧</h2>
    <table class="table table-striped">
      <thead>
        <tr>
          <th scope="col" style="width: 30%">Title</th>
          <th scope="col" style="width: 50%">Content</th>
          <th scope="col" style="width: 20%" class="text-end">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="post : ${posts}">
          <td>
            <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"></a>
          </td>
          <td>
            <span th:text="${post.content}"></span>
          </td>
          <td class="text-end">
            <div th:if="${post.user != null and loggedInUserId == post.user.id}">
              <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-primary btn-sm">Edit</a>
              <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display: inline">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
