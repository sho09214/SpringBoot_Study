<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.new.nz/web/thymeleaf/layout" layout:decorate="layout/layout">
<head>
  <meta charset="UTF-8">
  <title layout:fragment="title">Login</title>
</head>
<body>
  <main layout:fragment="content">
    <h1 class="text-center">Login</h1>
    <form th:action="@{/auth/login}" method="post" class="mx-auto" style="max-width: 400px;">
      <div class="mb-3">
        <label for="username" class="form-label">UserName</label>
        <input type="text" name="username" id="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">UserName</label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </main>
</body>
</html>
